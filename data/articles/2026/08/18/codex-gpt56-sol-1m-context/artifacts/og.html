<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT-5.6 Sol 1M 上下文</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      background: #fafaf7;
      color: #101114;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 64px 72px;
    }
    .column {
      color: #155eef;
      font-size: 25px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    h1 {
      width: 760px;
      margin: 68px 0 0;
      font-size: 66px;
      line-height: 1.16;
      letter-spacing: -.025em;
    }
    .signal {
      position: absolute;
      top: 106px;
      right: 78px;
      display: flex;
      align-items: baseline;
      color: #155eef;
    }
    .signal strong {
      font-size: 174px;
      line-height: 1;
      letter-spacing: -.08em;
    }
    .signal span {
      margin-left: 18px;
      color: #101114;
      font-size: 34px;
      font-weight: 650;
    }
    .rule {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 84px;
      height: 2px;
      background: #e8eeff;
    }
    .brand {
      position: absolute;
      right: 72px;
      bottom: 42px;
      color: #155eef;
      font-size: 20px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <div class="column">FRONTIER SIGNALS</div>
    <h1>GPT-5.6 Sol 1M 上下文<br>向 ChatGPT 账号开放</h1>
    <div class="signal" aria-hidden="true"><strong>1M</strong><span>CONTEXT</span></div>
    <div class="rule"></div>
    <div class="brand">FRONTIER WORLD</div>
  </main>
</body>
</html>
